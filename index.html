<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goon-Dex - Artist Directory</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        retro: {
                            bg: '#fdf6e2',
                            card: '#faedcd',
                            border: '#d4a373',
                            primary: '#bc6c25',
                            dark: '#603813',
                            text: '#432818'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-retro-bg text-retro-text min-h-screen flex flex-col font-sans selection:bg-retro-primary selection:text-white">

    <!-- Header -->
    <header class="bg-retro-card border-b-4 border-retro-border py-6 px-4 shadow-md">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <h1 class="text-3xl font-black tracking-wider text-retro-dark uppercase">Goon-Dex</h1>
            </div>
            <div class="w-full sm:w-auto flex gap-2">
                <input type="text" id="searchInput" placeholder="Rechercher un artiste..." class="px-4 py-2 rounded-lg border-2 border-retro-border bg-white text-retro-text focus:outline-none focus:border-retro-primary w-full sm:w-64">
                <button onclick="openAddModal()" class="bg-retro-primary hover:bg-retro-dark text-white font-bold px-4 py-2 rounded-lg border-2 border-retro-dark shadow transition whitespace-nowrap">
                    + Ajouter
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        <!-- Tags Filter -->
        <div id="tagsContainer" class="flex flex-wrap gap-2 mb-8">
            <button onclick="filterByTag('ALL')" class="tag-btn active px-3 py-1 rounded-full text-sm font-bold bg-retro-primary text-white border-2 border-retro-dark">Tous</button>
        </div>

        <!-- Artists Grid -->
        <div id="artistsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamically injected -->
        </div>
    </main>

    <!-- Add Artist Modal -->
    <div id="addModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-retro-card border-4 border-retro-dark rounded-xl max-w-lg w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <h2 class="text-2xl font-black text-retro-dark mb-4 uppercase">Ajouter un artiste</h2>
            <form id="addArtistForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div>
                    <label class="block font-bold text-sm mb-1 text-retro-dark">Nom de l'artiste</label>
                    <input type="text" id="artistName" required class="w-full px-3 py-2 rounded-lg border-2 border-retro-border bg-white focus:outline-none focus:border-retro-primary">
                </div>
                <div>
                    <label class="block font-bold text-sm mb-1 text-retro-dark">Images (URLs séparées par des virgules)</label>
                    <input type="text" id="artistImages" placeholder="https://..., https://..." required class="w-full px-3 py-2 rounded-lg border-2 border-retro-border bg-white focus:outline-none focus:border-retro-primary">
                </div>
                <div>
                    <label class="block font-bold text-sm mb-1 text-retro-dark">Description</label>
                    <textarea id="artistDesc" rows="3" class="w-full px-3 py-2 rounded-lg border-2 border-retro-border bg-white focus:outline-none focus:border-retro-primary"></textarea>
                </div>
                <div>
                    <label class="block font-bold text-sm mb-1 text-retro-dark">Liens (Format: Titre|URL, un par ligne)</label>
                    <textarea id="artistLinks" rows="2" placeholder="Twitter|https://twitter.com/..." class="w-full px-3 py-2 rounded-lg border-2 border-retro-border bg-white focus:outline-none focus:border-retro-primary"></textarea>
                </div>
                <div>
                    <label class="block font-bold text-sm mb-1 text-retro-dark">Tags (séparés par des virgules)</label>
                    <input type="text" id="artistTags" placeholder="Art, 3D, Animation" class="w-full px-3 py-2 rounded-lg border-2 border-retro-border bg-white focus:outline-none focus:border-retro-primary">
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeAddModal()" class="px-4 py-2 rounded-lg border-2 border-retro-dark bg-gray-200 font-bold hover:bg-gray-300">Annuler</button>
                    <button type="submit" class="px-4 py-2 rounded-lg border-2 border-retro-dark bg-retro-primary text-white font-bold hover:bg-retro-dark">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-retro-card border-t-4 border-retro-border py-4 text-center text-sm font-semibold text-retro-dark mt-auto">
        Goon-Dex &bull; Propulsé par Supabase & GitHub Pages
    </footer>

    <!-- Supabase Initialization Script -->
    <script>
        const SUPABASE_URL = "https://qmxjgwyxkakkxkeyflqx.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_S0zW_2DKvCxnhpN5-LRzvQ_0Lxhm-RB";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allArtists = [];
        let currentTag = 'ALL';

        async function fetchArtists() {
            const { data, error } = await supabaseClient.from('artists').select('*').order('id', { ascending: true });
            if (error) {
                console.error("Erreur de chargement:", error);
                alert("Erreur lors de l'enregistrement public : " + error.message);
                return;
            }
            allArtists = data || [];
            renderTags();
            renderArtists(allArtists);
        }

        function renderArtists(artists) {
            const grid = document.getElementById('artistsGrid');
            grid.innerHTML = '';
            
            if (artists.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-retro-dark font-semibold py-8">Aucun artiste trouvé.</p>`;
                return;
            }

            artists.forEach(artist => {
                const images = Array.isArray(artist.images) ? artist.images : [];
                const links = Array.isArray(artist.links) ? artist.links : [];
                const tags = Array.isArray(artist.tags) ? artist.tags : [];

                const card = document.createElement('div');
                card.className = "bg-retro-card border-4 border-retro-dark rounded-xl overflow-hidden shadow-lg flex flex-col justify-between";
                
                card.innerHTML = `
                    <div>
                        ${images.length > 0 ? `<img src="${images[0]}" alt="${artist.name}" class="w-full h-48 object-cover border-b-4 border-retro-dark">` : ''}
                        <div class="p-4">
                            <h3 class="text-xl font-black text-retro-dark mb-2">${artist.name}</h3>
                            <p class="text-sm mb-4 text-retro-text whitespace-pre-line">${artist.description || ''}</p>
                            <div class="flex flex-wrap gap-1 mb-4">
                                ${tags.map(tag => `<span class="bg-retro-border text-retro-dark text-xs font-bold px-2 py-0.5 rounded">${tag}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                    <div class="p-4 pt-0 flex flex-wrap gap-2">
                        ${links.map(link => `<a href="${link.url}" target="_blank" class="bg-retro-primary hover:bg-retro-dark text-white text-xs font-bold px-3 py-1.5 rounded-lg border-2 border-retro-dark">${link.title}</a>`).join('')}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderTags() {
            const tagsSet = new Set();
            allArtists.forEach(a => {
                if (Array.isArray(a.tags)) {
                    a.tags.forEach(t => tagsSet.add(t));
                }
            });

            const container = document.getElementById('tagsContainer');
            container.innerHTML = `<button onclick="filterByTag('ALL')" class="tag-btn px-3 py-1 rounded-full text-sm font-bold ${currentTag === 'ALL' ? 'bg-retro-primary text-white border-2 border-retro-dark' : 'bg-white text-retro-dark border-2 border-retro-border'}">Tous</button>`;

            tagsSet.forEach(tag => {
                const isActive = currentTag === tag;
                const btn = document.createElement('button');
                btn.onclick = () => filterByTag(tag);
                btn.className = `tag-btn px-3 py-1 rounded-full text-sm font-bold ${isActive ? 'bg-retro-primary text-white border-2 border-retro-dark' : 'bg-white text-retro-dark border-2 border-retro-border'}`;
                btn.textContent = tag;
                container.appendChild(btn);
            });
        }

        function filterByTag(tag) {
            currentTag = tag;
            renderTags();
            if (tag === 'ALL') {
                renderArtists(allArtists);
            } else {
                const filtered = allArtists.filter(a => Array.isArray(a.tags) && a.tags.includes(tag));
                renderArtists(filtered);
            }
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allArtists.filter(a => a.name.toLowerCase().includes(query) || (a.description && a.description.toLowerCase().includes(query)));
            renderArtists(filtered);
        });

        function openAddModal() {
            document.getElementById('addModal').classList.remove('hidden');
            document.getElementById('addModal').classList.add('flex');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('flex');
            document.getElementById('addModal').classList.add('hidden');
        }

        async function handleFormSubmit(event) {
            event.preventDefault();
            const name = document.getElementById('artistName').value;
            const images = document.getElementById('artistImages').value.split(',').map(s => s.trim()).filter(Boolean);
            const description = document.getElementById('artistDesc').value;
            
            const rawLinks = document.getElementById('artistLinks').value.split('\n');
            const links = rawLinks.map(l => {
                const parts = l.split('|');
                if (parts.length === 2) {
                    return { title: parts[0].trim(), url: parts[1].trim() };
                }
                return null;
            }).filter(Boolean);

            const tags = document.getElementById('artistTags').value.split(',').map(s => s.trim()).filter(Boolean);

            const { error } = await supabaseClient.from('artists').insert([{ name, images, description, links, tags }]);
            if (error) {
                alert("Erreur lors de l'enregistrement : " + error.message);
            } else {
                closeAddModal();
                document.getElementById('addArtistForm').reset();
                fetchArtists();
            }
        }

        fetchArtists();
    </script>
</body>
</html>
